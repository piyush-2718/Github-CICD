name: Trail CICD Pipeline

on:
  workflow_dispatch:

jobs:
  Code:
    runs-on: ubuntu-latest
      
    steps:
    - name: Checkout code
      run: echo "checking Code"

  Build:
    runs-on: ubuntu-latest
    steps:
    - name: Building Code using Docker 
      run: echo "Build Code using Docker"
      
  Test:
    runs-on: ubuntu-latest 
    needs: Build
    steps:
    - name: Testing code
      run: echo "Unit Testing "
      
  Deploy:
    runs-on: ubuntu-latest
    needs: [Test,Build]
    steps:
    - name: Delpoying
      run: echo "Deploy to AWS"

    
