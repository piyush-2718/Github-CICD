name: python syntax testing

on:
  workflow_dispatch:
  push:
    paths: "*.py"
 
jobs:
  checking-python-syn-error:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
  
      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.12'
  
      - name: Install ruff
        run: pip install ruff
  
      - name: Checking Syntax error
        run: ruff check .
      
